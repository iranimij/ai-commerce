name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull-request runs, never runs on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aicommerce
          POSTGRES_PASSWORD: aicommerce
          POSTGRES_DB: aicommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aicommerce -d aicommerce"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://aicommerce_app:aicommerce_app@localhost:5432/aicommerce
      MIGRATION_DATABASE_URL: postgres://aicommerce:aicommerce@localhost:5432/aicommerce
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:roles
      # pg_dump and pg_restore must match the PostgreSQL 17 server for the CLI backup tests.
      - name: Install the PostgreSQL 17 client
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          pg_dump --version
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      # The sample third-party module through the real server: fails by name when a core change breaks a module.
      - name: Contract test (sample module)
        run: |
          pnpm --filter @aicommerce/module-sample test
          pnpm --filter @aicommerce/module-sample test:integration
          pnpm --filter @aicommerce/server exec vitest run --config vitest.integration.config.ts src/contract.integration.test.ts

  # The production image from docker/Dockerfile. Publishing it waits for the @aicommerce scope.
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the production image
        run: docker build -f docker/Dockerfile -t ai-commerce:ci .
      - name: The image runs as a non-root user
        run: test "$(docker run --rm ai-commerce:ci id -u)" != 0
      # As a shop owner would see it: the link the shop prints opens the setup page.
      - name: The printed setup link opens the setup page
        run: |
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_USER=aicommerce -e POSTGRES_PASSWORD=aicommerce postgres:17
          until docker exec smoke-db pg_isready -h 127.0.0.1 -U aicommerce; do sleep 1; done
          docker run -d --name smoke-shop --network smoke -p 127.0.0.1:3000:3000 \
            -e DATABASE_URL=postgres://aicommerce_app:aicommerce_app@smoke-db:5432/aicommerce \
            -e MIGRATION_DATABASE_URL=postgres://aicommerce:aicommerce@smoke-db:5432/aicommerce \
            -e AICOMMERCE_PUBLIC_URL=http://localhost:3000 \
            -e AICOMMERCE_SECRET_KEY=ZGV2ZWxvcG1lbnQtb25seS1zZWNyZXQta2V5LTMyYiE= \
            -e AICOMMERCE_AUTH_SECRET=smoke-test-only-auth-secret-not-for-production \
            ai-commerce:ci sh -c 'node packages/db/scripts/roles.mjs && exec node apps/server/dist/supervisor.js'
          for _ in $(seq 60); do
            link=$(docker logs smoke-shop 2>&1 | grep -o 'http://localhost:3000/setup?token=[A-Za-z0-9_-]*' || true)
            [ -n "$link" ] && break
            sleep 2
          done
          docker logs smoke-shop
          test -n "$link"
          test "$(curl -s --retry 10 --retry-connrefused -o /dev/null -w '%{http_code}' "$link")" = 200

  # The setup page in a browser against the production image, each test on a fresh database.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the production image
        run: docker build -f docker/Dockerfile -t ai-commerce:test .
      # As root: the checkout belongs to the runner's user, not to the container's node user.
      - name: Install dependencies
        run: docker compose run --rm -T --user root app pnpm install --frozen-lockfile
      - name: End-to-end tests
        run: ./dev e2e
      - name: Keep the traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: e2e/test-results
          retention-days: 14

  # Not a required check: a new advisory must not turn every unrelated pull request red.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level high
