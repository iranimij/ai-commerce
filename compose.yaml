# Everything runs here. The host needs only Docker, git and gh.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm-store
    environment:
      DATABASE_URL: postgres://aicommerce:aicommerce@db:5432/aicommerce
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: aicommerce
      POSTGRES_PASSWORD: aicommerce
      POSTGRES_DB: aicommerce
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aicommerce -d aicommerce']
      interval: 2s
      timeout: 3s
      retries: 20

  mail:
    image: axllent/mailpit
    ports:
      - '8025:8025'

volumes:
  node_modules:
  pnpm_store:
  db_data:
