# Everything runs here. The host needs only Docker, git and gh.

x-e2e-shop: &e2e-shop
  image: ai-commerce:test
  profiles: [e2e]
  command: ['sh', '/e2e/shop.sh']
  init: true
  volumes:
    - ./e2e/shop.sh:/e2e/shop.sh:ro
    - e2e_logs:/logs
  depends_on:
    e2e-db:
      condition: service_healthy

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm-store
    environment:
      # Runtime role (no DDL, append-only audit) and the owner that runs migrations.
      DATABASE_URL: postgres://aicommerce_app:aicommerce_app@db:5432/aicommerce
      MIGRATION_DATABASE_URL: postgres://aicommerce:aicommerce@db:5432/aicommerce
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
    depends_on:
      db:
        condition: service_healthy

  # The API and the job worker: ./dev docker compose up server, then http://localhost:3000.
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /app
    # exec: node becomes PID 1 and receives SIGTERM for a graceful stop.
    command: sh -c "pnpm db:roles && pnpm build && exec node apps/server/dist/main.js"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm-store
      - files:/var/lib/aicommerce/files
    environment:
      DATABASE_URL: postgres://aicommerce_app:aicommerce_app@db:5432/aicommerce
      MIGRATION_DATABASE_URL: postgres://aicommerce:aicommerce@db:5432/aicommerce
      # Development values only. Production keys come from the environment, never from git.
      AICOMMERCE_SECRET_KEY: ZGV2ZWxvcG1lbnQtb25seS1zZWNyZXQta2V5LTMyYiE=
      AICOMMERCE_AUTH_SECRET: development-only-auth-secret-not-for-production
      # Browsers reach the server through the admin's /api proxy, so this is the admin origin.
      AICOMMERCE_PUBLIC_URL: http://localhost:3001
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy
    # Healthy once built and listening; the admin waits for it, as the build includes the admin.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 600s

  # The admin, in M0c only the setup page: docker compose up server admin, then http://localhost:3001.
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /app/apps/admin
    # next start serves this build despite its warning about output: 'standalone'; the image runs
    # .next/standalone/apps/admin/server.js instead.
    command: sh -c "exec node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port 3001"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm-store
    environment:
      AICOMMERCE_SERVER_URL: http://server:3000
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      server:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: aicommerce
      POSTGRES_PASSWORD: aicommerce
      POSTGRES_DB: aicommerce
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aicommerce -d aicommerce']
      interval: 2s
      timeout: 3s
      retries: 20

  mail:
    image: axllent/mailpit:v1.33.1
    ports:
      - '127.0.0.1:8025:8025'

  # End-to-end tests (./dev e2e): the production image ai-commerce:test, one shop per test that
  # needs a fresh install, each with its own database. e2e/db.sql creates the databases and
  # playwright's E2E_SHOPS counts the shops: keep all three in step.
  e2e-db:
    image: postgres:17
    profiles: [e2e]
    environment:
      POSTGRES_USER: aicommerce
      POSTGRES_PASSWORD: aicommerce
      POSTGRES_DB: aicommerce
    # In memory: every run starts from an empty server.
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ./e2e/db.sql:/docker-entrypoint-initdb.d/db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aicommerce -d shop16']
      interval: 2s
      timeout: 3s
      retries: 30

  e2e-shop-0: { <<: *e2e-shop, environment: { SHOP: '0' } }
  e2e-shop-1: { <<: *e2e-shop, environment: { SHOP: '1' } }
  e2e-shop-2: { <<: *e2e-shop, environment: { SHOP: '2' } }
  e2e-shop-3: { <<: *e2e-shop, environment: { SHOP: '3' } }
  e2e-shop-4: { <<: *e2e-shop, environment: { SHOP: '4' } }
  e2e-shop-5: { <<: *e2e-shop, environment: { SHOP: '5' } }
  e2e-shop-6: { <<: *e2e-shop, environment: { SHOP: '6' } }
  e2e-shop-7: { <<: *e2e-shop, environment: { SHOP: '7' } }
  e2e-shop-8: { <<: *e2e-shop, environment: { SHOP: '8' } }
  e2e-shop-9: { <<: *e2e-shop, environment: { SHOP: '9' } }
  e2e-shop-10: { <<: *e2e-shop, environment: { SHOP: '10' } }
  e2e-shop-11: { <<: *e2e-shop, environment: { SHOP: '11' } }
  e2e-shop-12: { <<: *e2e-shop, environment: { SHOP: '12' } }
  e2e-shop-13: { <<: *e2e-shop, environment: { SHOP: '13' } }
  e2e-shop-14: { <<: *e2e-shop, environment: { SHOP: '14' } }
  e2e-shop-15: { <<: *e2e-shop, environment: { SHOP: '15' } }
  e2e-shop-16: { <<: *e2e-shop, environment: { SHOP: '16' } }

  playwright:
    # The same version as @playwright/test in e2e/package.json.
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [e2e]
    working_dir: /app/e2e
    init: true
    ipc: host
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - e2e_logs:/logs:ro
    environment:
      E2E_SHOPS: '17'
      CI: ${CI:-}
    depends_on:
      e2e-shop-0:
        condition: service_started
      e2e-shop-1:
        condition: service_started
      e2e-shop-2:
        condition: service_started
      e2e-shop-3:
        condition: service_started
      e2e-shop-4:
        condition: service_started
      e2e-shop-5:
        condition: service_started
      e2e-shop-6:
        condition: service_started
      e2e-shop-7:
        condition: service_started
      e2e-shop-8:
        condition: service_started
      e2e-shop-9:
        condition: service_started
      e2e-shop-10:
        condition: service_started
      e2e-shop-11:
        condition: service_started
      e2e-shop-12:
        condition: service_started
      e2e-shop-13:
        condition: service_started
      e2e-shop-14:
        condition: service_started
      e2e-shop-15:
        condition: service_started
      e2e-shop-16:
        condition: service_started

volumes:
  node_modules:
  pnpm_store:
  db_data:
  # Uploaded images, kept across restarts.
  files:
  # In memory, so each run's shops start with an empty log.
  e2e_logs:
    driver_opts: { type: tmpfs, device: tmpfs }
